<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milky Fenton & Whimsical Goth • BPD Poetry Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --milk: #f8f1e9;
      --cream: #f3e6d8;
      --blush: #e8c4c4;
      --rose: #c97b84;
      --deep-rose: #8a4a55;
      --lavender: #b8a9c9;
      --mist: #d4c5d9;
      --ink: #2a1f2d;
      --shadow: #1a121c;
      --gold: #c9a86c;
      --soft-black: #1e1520;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at 30% 20%, #2a1f2d 0%, #1a121c 40%, #0d0a0e 100%);
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Cormorant Garamond', serif;
      color: var(--ink);
      position: relative;
    }

    /* ========== SHOOTING STARS ========== */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 240, 220, 0.8);
      animation: shoot linear infinite;
      opacity: 0;
    }

    @keyframes shoot {
      0% {
        transform: translateX(0) translateY(0) rotate(45deg) scale(0);
        opacity: 0;
      }
      5% {
        opacity: 1;
        transform: translateX(0) translateY(0) rotate(45deg) scale(1);
      }
      100% {
        transform: translateX(120vw) translateY(80vh) rotate(45deg) scale(0.2);
        opacity: 0;
      }
    }

    /* ========== FAIRIES ========== */
    .fairy {
      position: fixed;
      width: 28px;
      height: 28px;
      pointer-events: none;
      z-index: 5;
      animation: floatFairy linear infinite;
      filter: drop-shadow(0 0 8px rgba(232, 196, 196, 0.7));
    }

    .fairy svg {
      width: 100%;
      height: 100%;
    }

    @keyframes floatFairy {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      25% {
        transform: translate(40px, -60px) rotate(8deg) scale(1.1);
      }
      50% {
        transform: translate(-20px, -120px) rotate(-5deg) scale(0.95);
      }
      75% {
        transform: translate(60px, -40px) rotate(12deg) scale(1.05);
      }
      100% {
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
    }

    /* ========== HEADER / SPOTIFY ========== */
    header {
      position: relative;
      z-index: 20;
      padding: 18px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(26, 18, 28, 0.92) 0%, rgba(26, 18, 28, 0.6) 70%, transparent 100%);
    }

    .title-block {
      text-align: center;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      color: var(--cream);
      text-shadow: 0 0 20px rgba(201, 168, 108, 0.4), 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--lavender);
      margin-top: -6px;
      opacity: 0.9;
    }

    .spotify-wrap {
      width: min(420px, 92vw);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(201, 168, 108, 0.25);
      background: #121212;
    }

    .spotify-wrap iframe {
      display: block;
      width: 100%;
      height: 80px;
      border: none;
    }

    /* ========== BOOK ========== */
    .book-scene {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px 80px;
      min-height: calc(100vh - 200px);
    }

    .book {
      position: relative;
      width: min(720px, 94vw);
      height: min(520px, 70vh);
      perspective: 2200px;
      transform-style: preserve-3d;
    }

    .page {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--milk) 0%, var(--cream) 50%, #f0e4d6 100%);
      border-radius: 4px 12px 12px 4px;
      box-shadow:
        0 0 0 1px rgba(138, 74, 85, 0.15),
        8px 12px 40px rgba(0,0,0,0.45),
        inset 0 0 60px rgba(232, 196, 196, 0.15);
      transform-origin: left center;
      transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);
      backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .page::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(232, 196, 196, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(184, 169, 201, 0.2) 0%, transparent 45%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c97b84' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .page-inner {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 28px 36px 24px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Decorative borders */
    .page-border {
      position: absolute;
      inset: 10px;
      border: 1.5px solid rgba(138, 74, 85, 0.25);
      border-radius: 2px 8px 8px 2px;
      pointer-events: none;
      z-index: 2;
    }

    .page-border::before,
    .page-border::after {
      content: '✦';
      position: absolute;
      color: var(--rose);
      font-size: 11px;
      opacity: 0.6;
    }
    .page-border::before { top: -7px; left: 50%; transform: translateX(-50%); }
    .page-border::after { bottom: -7px; left: 50%; transform: translateX(-50%); }

    /* Corner flourishes */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      opacity: 0.45;
      z-index: 3;
    }
    .corner.tl { top: 14px; left: 14px; }
    .corner.tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .corner.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .corner.br { bottom: 14px; right: 14px; transform: scale(-1); }

    .page-number {
      position: absolute;
      bottom: 16px;
      right: 28px;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      color: var(--deep-rose);
      letter-spacing: 2px;
      opacity: 0.7;
      z-index: 4;
    }

    .page-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px 8px;
      overflow: hidden;
    }

    .poem-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(1.6rem, 3.2vw, 2.1rem);
      color: var(--deep-rose);
      margin-bottom: 14px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }

    .poem-body {
      font-size: clamp(0.95rem, 1.8vw, 1.15rem);
      line-height: 1.65;
      color: var(--ink);
      max-width: 420px;
      font-style: italic;
    }

    .poem-body p {
      margin-bottom: 0.7em;
    }

    .art-block {
      margin: 12px 0;
      opacity: 0.85;
    }

    /* Cover specific */
    .cover .page-inner {
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(160deg, #3a2a3a 0%, #2a1f2d 40%, #1a121c 100%);
      color: var(--cream);
      border-radius: 4px 12px 12px 4px;
    }

    .cover-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      color: var(--cream);
      text-shadow: 0 0 30px rgba(201, 168, 108, 0.5);
      margin-bottom: 8px;
    }

    .cover-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--lavender);
      margin-bottom: 28px;
    }

    .cover-ornament {
      font-size: 1.8rem;
      color: var(--gold);
      opacity: 0.8;
      margin: 12px 0;
    }

    .cover-quote {
      font-style: italic;
      font-size: 1rem;
      max-width: 280px;
      color: var(--mist);
      line-height: 1.5;
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(26, 18, 28, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 22px;
      border-radius: 50px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(201, 168, 108, 0.2);
    }

    .ctrl-btn {
      background: transparent;
      border: 1.5px solid var(--rose);
      color: var(--cream);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      font-family: 'Cinzel', serif;
    }

    .ctrl-btn:hover {
      background: var(--rose);
      color: var(--shadow);
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(201, 123, 132, 0.5);
    }

    .ctrl-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .page-indicator {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: var(--lavender);
      letter-spacing: 2px;
      min-width: 70px;
      text-align: center;
    }

    /* Instructions */
    .hint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(212, 197, 217, 0.6);
      letter-spacing: 1px;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.6s;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .book {
        height: min(480px, 62vh);
      }
      .page-inner {
        padding: 20px 22px 18px;
      }
      .poem-body {
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>
  <!-- Shooting stars -->
  <div class="stars" id="stars"></div>

  <!-- Fairies will be injected by JS -->

  <header>
    <div class="title-block">
      <h1 class="main-title">Petals &amp; Thorns</h1>
      <p class="subtitle">A Whimsical Goth Poetry Book for the Borderline Heart</p>
    </div>
    <div class="spotify-wrap">
      <!-- Pastel Goth / soft melancholic aesthetic playlist -->
      <iframe
        src="https://open.spotify.com/embed/playlist/1Kujwx9yES1ceIEQk6cqWc?utm_source=generator&theme=0"
        width="100%"
        height="80"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </header>

  <div class="book-scene">
    <div class="book" id="book">
      <!-- Pages will be generated by JS -->
    </div>
  </div>

  <p class="hint" id="hint">Click the arrows or use ← → keys to turn pages</p>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous page">←</button>
    <span class="page-indicator" id="pageInd">1 / 20</span>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next page">→</button>
  </div>

  <script>
    // ========== DATA: 20 pages of poetry + art ==========
    const pages = [
      {
        type: 'cover',
        title: 'Petals & Thorns',
        sub: 'Milky Fenton • Whimsical Goth',
        quote: 'For the hearts that bloom too brightly and break like glass under moonlight.'
      },
      {
        title: 'The Empty Room',
        body: `<p>I keep a chair for the ghost of who I was<br>
        before the mirror learned to split.</p>
        <p>Milk-glass petals float in the air—<br>
        soft, opaque, almost holy—<br>
        yet every one has a thorn of night.</p>
        <p>Sit with me, stranger-self.<br>
        The walls remember every storm<br>
        I named after someone who left.</p>`
      },
      {
        title: 'Abandonment Hymn',
        body: `<p>Do not go.<br>
        The fairies have already packed their wings<br>
        into the hollow of my ribs.</p>
        <p>I am the house that collapses<br>
        the moment the door clicks shut.</p>
        <p>Stay. Or at least leave a strand of hair<br>
        so I can weave a noose of memory<br>
        and call it devotion.</p>`
      },
      {
        title: 'Splitting the Rose',
        body: `<p>You were porcelain this morning.<br>
        By dusk you are the knife.</p>
        <p>I water both versions<br>
        with the same trembling hands—<br>
        milk and ink, bloom and bruise.</p>
        <p>There is no middle petal.<br>
        Only the ones I tear<br>
        to prove they were never whole.</p>`
      },
      {
        title: 'Identity as Lace',
        body: `<p>I wear a different face for every hour:<br>
        the girl who laughs like crystal,<br>
        the one who bites the inside of her cheek<br>
        until it tastes like copper and prayer.</p>
        <p>Who am I between the stitches?<br>
        A pattern of holes the light falls through.<br>
        Call me whatever name keeps you near.</p>`
      },
      {
        title: 'Emotional Weather',
        body: `<p>One moment I am the entire garden—<br>
        roses, nightshade, dew on every leaf.</p>
        <p>The next I am the frost that kills it.</p>
        <p>Do not ask me to choose a season.<br>
        My heart is a sky that cannot decide<br>
        whether to rain stars or shatter glass.</p>`
      },
      {
        title: 'Fear of the Soft Exit',
        body: `<p>I rehearse goodbyes in the mirror<br>
        until my reflection looks bored.</p>
        <p>If you leave gently I will invent a storm<br>
        just to feel the drama of your absence.</p>
        <p>Better a slammed door than a quiet one—<br>
        the quiet ones echo longer<br>
        inside the milky bones of me.</p>`
      },
      {
        title: 'Idealization & the Fall',
        body: `<p>I built you a cathedral of silver filigree<br>
        and called every window your name.</p>
        <p>Then I watched you become ordinary<br>
        and hated you for the crime of being real.</p>
        <p>Forgive the ruins.<br>
        I only know how to love in ruins<br>
        or not at all.</p>`
      },
      {
        title: 'The Black & White Garden',
        body: `<p>There is no grey between the petals.<br>
        Either you are the moon<br>
        or you are the thing that swallows it.</p>
        <p>I plant both seeds in the same soil<br>
        and water them with the same tears.</p>
        <p>One day the garden will choose for me.<br>
        Until then I live in the space<br>
        where both flowers refuse to bloom.</p>`
      },
      {
        title: 'Self-Soothing Ritual',
        body: `<p>I light a candle shaped like a fairy wing<br>
        and speak to the empty chair.</p>
        <p>Tell me I am still here.<br>
        Tell me the milk-glass heart<br>
        has not cracked all the way through.</p>
        <p>The flame answers in a language<br>
        only the lonely understand.</p>`
      },
      {
        title: 'Rage Like Nightshade',
        body: `<p>It rises without warning—<br>
        a violet poison under the tongue.</p>
        <p>I smile while the room tilts.<br>
        I say “I’m fine” while my hands<br>
        invent new ways to break beautiful things.</p>
        <p>Later I will gather the shards<br>
        and call them jewelry.<br>
        That is how I survive myself.</p>`
      },
      {
        title: 'Emptiness as a Guest',
        body: `<p>Some days the house is full of me<br>
        and still feels vacant.</p>
        <p>I set a place for the hollow feeling<br>
        and feed it leftover moonlight.</p>
        <p>It never leaves a tip.<br>
        It never says thank you.<br>
        It only asks, in the softest voice,<br>
        “When will you become someone?”</p>`
      },
      {
        title: 'Love as a Recurring Dream',
        body: `<p>Every new face wears the old mask<br>
        for a little while.</p>
        <p>I fall in love with the possibility<br>
        of never being left again.</p>
        <p>Then the dream ends<br>
        and I wake holding a handful of petals<br>
        that were never real.</p>`
      },
      {
        title: 'The Mirror That Lies',
        body: `<p>Some mornings I am radiant—<br>
        a Fenton rose glowing from within.</p>
        <p>By afternoon I am the crack<br>
        that runs through the glass.</p>
        <p>Which version is true?<br>
        Both. Neither.<br>
        The mirror only shows<br>
        what the heart is currently screaming.</p>`
      },
      {
        title: 'Chronic Loneliness',
        body: `<p>Even in a crowded room<br>
        I am the last fairy at the edge of the wood<br>
        waiting for someone to notice the light<br>
        I keep forgetting to turn on.</p>
        <p>I speak in soft riddles<br>
        so no one will know how loudly<br>
        I am asking to be held.</p>`
      },
      {
        title: 'The Cycle',
        body: `<p>Idealize. Cling. Split. Mourn.<br>
        Repeat until the petals<br>
        forget how to open.</p>
        <p>I know the pattern by heart<br>
        and still walk into it barefoot,<br>
        hoping this time the thorns<br>
        will bloom into something kinder.</p>`
      },
      {
        title: 'Letter to the Future Self',
        body: `<p>Dear girl who still believes<br>
        she can be whole—</p>
        <p>Keep the milk-glass soft.<br>
        Keep the gothic lace black.<br>
        Keep the fairies flying<br>
        even when the sky is empty.</p>
        <p>You are allowed to be both<br>
        the flower and the storm.</p>`
      },
      {
        title: 'Soft Apocalypse',
        body: `<p>The world ends quietly for me—<br>
        not with fire, but with a sigh<br>
        that sounds like someone packing.</p>
        <p>I rearrange the furniture of my heart<br>
        so the absence has somewhere pretty to sit.</p>
        <p>Even endings can be aesthetic<br>
        if you light enough candles.</p>`
      },
      {
        title: 'Borderline Lullaby',
        body: `<p>Hush, little heart,<br>
        the stars are only temporary.</p>
        <p>You may love too hard.<br>
        You may break too easily.<br>
        You may invent entire religions<br>
        out of a single glance.</p>
        <p>Still you are made of the same dust<br>
        as every fairy and every rose.<br>
        Sleep. The night will hold you<br>
        even if no one else does.</p>`
      },
      {
        title: 'Closing Page',
        body: `<p>Thank you for turning these pages<br>
        with hands that understand<br>
        what it means to feel everything<br>
        and nothing at once.</p>
        <p>May your own milky glass stay soft.<br>
        May your thorns learn to bloom.<br>
        May the fairies never stop<br>
        circling your name.</p>
        <p style="margin-top:1.4em;font-style:normal;opacity:0.7;">— for every borderline heart<br>that still believes in beauty</p>`
      }
    ];

    // ========== GENERATE STARS ==========
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 18; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 40 + 'vh';
      star.style.animationDuration = (4 + Math.random() * 6) + 's';
      star.style.animationDelay = (Math.random() * 10) + 's';
      starsContainer.appendChild(star);
    }

    // ========== GENERATE FAIRIES ==========
    const fairySVG = `
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="32" cy="28" rx="8" ry="10" fill="#f8e8e0"/>
        <path d="M24 24 Q12 10 8 18 Q16 22 24 28" fill="#e8c4c4" opacity="0.85"/>
        <path d="M40 24 Q52 10 56 18 Q48 22 40 28" fill="#e8c4c4" opacity="0.85"/>
        <path d="M22 30 Q8 40 12 48 Q22 42 26 34" fill="#d4c5d9" opacity="0.7"/>
        <path d="M42 30 Q56 40 52 48 Q42 42 38 34" fill="#d4c5d9" opacity="0.7"/>
        <circle cx="29" cy="26" r="1.5" fill="#2a1f2d"/>
        <circle cx="35" cy="26" r="1.5" fill="#2a1f2d"/>
        <path d="M30 32 Q32 34 34 32" stroke="#c97b84" stroke-width="1" fill="none"/>
        <path d="M28 18 Q32 12 36 18" stroke="#c9a86c" stroke-width="1.5" fill="none"/>
        <circle cx="32" cy="14" r="2" fill="#c9a86c" opacity="0.8"/>
      </svg>`;

    for (let i = 0; i < 7; i++) {
      const fairy = document.createElement('div');
      fairy.className = 'fairy';
      fairy.innerHTML = fairySVG;
      fairy.style.left = (5 + Math.random() * 90) + 'vw';
      fairy.style.top = (10 + Math.random() * 70) + 'vh';
      fairy.style.animationDuration = (12 + Math.random() * 18) + 's';
      fairy.style.animationDelay = (Math.random() * 8) + 's';
      fairy.style.opacity = 0.55 + Math.random() * 0.4;
      document.body.appendChild(fairy);
    }

    // ========== CORNER FLOURISH SVG ==========
    const cornerSVG = `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 2 Q20 8 38 2" stroke="#c97b84" stroke-width="1.2" fill="none"/>
      <path d="M2 2 Q8 20 2 38" stroke="#c97b84" stroke-width="1.2" fill="none"/>
      <circle cx="6" cy="6" r="2" fill="#c9a86c" opacity="0.7"/>
      <path d="M12 4 Q16 10 14 16" stroke="#b8a9c9" stroke-width="0.8" fill="none"/>
    </svg>`;

    // ========== BUILD BOOK ==========
    const book = document.getElementById('book');
    let currentPage = 0;
    const totalPages = pages.length;

    function createPage(data, index) {
      const page = document.createElement('div');
      page.className = 'page' + (data.type === 'cover' ? ' cover' : '');
      page.dataset.index = index;

      if (data.type === 'cover') {
        page.innerHTML = `
          <div class="page-inner">
            <div class="cover-ornament">✦ ✧ ✦</div>
            <h2 class="cover-title">${data.title}</h2>
            <p class="cover-sub">${data.sub}</p>
            <div class="cover-ornament">❧</div>
            <p class="cover-quote">${data.quote}</p>
            <div class="cover-ornament" style="margin-top:28px;">✦ ✧ ✦</div>
          </div>
        `;
      } else {
        page.innerHTML = `
          <div class="page-border"></div>
          <div class="corner tl">${cornerSVG}</div>
          <div class="corner tr">${cornerSVG}</div>
          <div class="corner bl">${cornerSVG}</div>
          <div class="corner br">${cornerSVG}</div>
          <div class="page-inner">
            <div class="page-content">
              <h3 class="poem-title">${data.title}</h3>
              <div class="poem-body">${data.body}</div>
            </div>
            <div class="page-number">${String(index).padStart(2, '0')}</div>
          </div>
        `;
      }
      return page;
    }

    // Create all pages (stacked, last on top initially)
    pages.forEach((p, i) => {
      const pageEl = createPage(p, i);
      book.appendChild(pageEl);
    });

    // Set initial z-index and transforms
    function updateBook() {
      const pageEls = book.querySelectorAll('.page');
      pageEls.forEach((el, i) => {
        if (i < currentPage) {
          // Already flipped
          el.style.transform = 'rotateY(-180deg)';
          el.style.zIndex = i;
        } else {
          el.style.transform = 'rotateY(0deg)';
          el.style.zIndex = totalPages - i;
        }
      });
      document.getElementById('pageInd').textContent = `${currentPage + 1} / ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage === totalPages - 1;

      // Hide hint after first interaction
      if (currentPage > 0) {
        document.getElementById('hint').style.opacity = '0';
      }
    }

    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        updateBook();
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        updateBook();
      }
    }

    document.getElementById('nextBtn').addEventListener('click', nextPage);
    document.getElementById('prevBtn').addEventListener('click', prevPage);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextPage();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevPage();
      }
    });

    // Click on right half to go next, left half to go prev
    book.addEventListener('click', (e) => {
      const rect = book.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x > rect.width / 2) nextPage();
      else prevPage();
    });

    updateBook();
  </script>
</body>
</html>
